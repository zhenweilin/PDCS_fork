schema_version = 1
generator_version = "dense-spd-arithmetic-v1"
family = "dense_spd_lasso"
description = "Dense 1000-by-1000 SPD Lasso matrices with arithmetic eigenvalue spacing"
julia_version = "1.10.4"
dimension = 1000
support_size = 50
seed = 20260814
maximum_eigenvalue = 1.0
condition_numbers = [10.0, 100.0, 1.0e3, 1.0e4, 1.0e5, 1.0e6]
eigenvalue_order = "descending"
eigenvalue_spacing = "arithmetic"
matrix_construction = "A = Q * Diagonal(eigenvalues) * transpose(Q)"
matrix_storage = "dense_float64"
reuse_basis_across_conditions = true
noise_std = 1.0e-3
lambda_rule = "lambda_ratio * norm(transpose(A) * b, Inf)"
lambda_ratio = 1.0e-3
objective = "norm(A*x-b, 2)^2 + lambda*norm(x, 1)"
formulation = "compact_soc_epigraph"
tolerance = 1.0e-6
time_limit_seconds_per_case = 3600

[solver_policy]
solvers = ["cuclarabel", "cuscs", "cupdcs"]
gpu = "H100"
visible_gpu_count = 1
save_solution_vectors = false
relative_metrics = [
    "comparison_primal_infeasibility_rel",
    "comparison_dual_infeasibility_rel",
    "comparison_relative_gap",
    "comparison_kkt_max",
]
