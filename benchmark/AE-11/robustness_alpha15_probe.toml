schema_version = 1
experiment = "AE-11 alpha=1.5 stability probe"
objective = "norm(A*x-b,2)^2 + lambda*norm(x,1)"
value_type = "Float64"
matrix_storage = "in_memory_sparse_csc"
save_instance_data = false
q = 5
u_block_size = 16
v_block_size = 4
kappas = [1.0, 1.0e2, 1.0e4, 1.0e6, 1.0e8]
panel_b_alphas = [1.5]
tolerances = [1.0e-6]

[protocol]
profile = "medium"
solver = "cupdcs_on"
panel = "B"
alpha = 1.5
solver_tolerance = 2.0e-7
verification_tolerance = 1.0e-6
time_limit_seconds = 3600.0
expected_records = 25

[medium]
m = 50000
n = 250000
seeds = [2026, 2027, 2028, 2029, 2030]
generator_kinds = ["structured"]
time_limit_1e_3_seconds = 3600.0
time_limit_1e_6_seconds = 3600.0

[execution]
check_terminate_frequency = 2000
print_frequency = 20000
max_outer_iterations = 3000000000
max_inner_iterations = 3000000000
warmup = true
cold_start = true

[statistics]
tail_fraction = 0.10

[verification]
require_finite_solution = true
maximum_normalized_kkt = 1.0e-6
maximum_normalized_dual_infeasibility = 1.0e-6
maximum_relative_duality_gap = 1.0e-5
require_nonzero_solution = true
