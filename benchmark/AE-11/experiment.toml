schema_version = 1
experiment = "AE-11 controlled-condition Lasso"
objective = "norm(A*x-b,2)^2 + lambda*norm(x,1)"
value_type = "Float64"
matrix_storage = "in_memory_sparse_csc"
save_instance_data = false
q = 5
u_block_size = 16
v_block_size = 4
kappas = [1.0, 1.0e2, 1.0e4, 1.0e6, 1.0e8]
panel_a_beta = 0.5
panel_b_alphas = [0.01, 0.1, 1.0]
tolerances = [1.0e-3, 1.0e-6]

[paths]
julia = "/home/zhenwei/PDCS_fork/.julia-bin/julia-1.12.6/bin/julia"
julia_depot = "/home/zhenwei/PDCS_fork/.julia-depot"
pdcs_project = "/home/zhenwei/PDCS_fork"
scs_gpu_project = "/home/zhenwei/PDCS_fork/benchmark/scs_gpu_env"
cuclarabel_project = "/home/zhenwei/PDCS_fork/benchmark/cuclarabel_env"

[pilot]
m = 1024
n = 5120
seeds = [2026, 2027]
generator_kinds = ["structured", "gaussian_qr"]
time_limit_1e_3_seconds = 7200.0
time_limit_1e_6_seconds = 18000.0

[medium]
m = 50000
n = 250000
seeds = [2026, 2027, 2028, 2029, 2030]
generator_kinds = ["structured"]
time_limit_1e_3_seconds = 7200.0
time_limit_1e_6_seconds = 18000.0

[large]
m = 500000
n = 2500000
seeds = [2026, 2027, 2028]
generator_kinds = ["structured"]
panels = ["A"]
time_limit_1e_3_seconds = 7200.0
time_limit_1e_6_seconds = 18000.0

[solvers]
pilot = ["cupdcs_on", "cupdcs_off", "pdcs_cpu", "scs_indirect", "clarabel_cpu", "mosek", "scs_gpu", "cuclarabel"]
medium = ["cupdcs_on", "cupdcs_off", "pdcs_cpu", "scs_indirect", "clarabel_cpu", "mosek", "scs_gpu", "cuclarabel"]
large = ["cupdcs_on", "cupdcs_off", "scs_gpu", "cuclarabel"]

[execution]
check_terminate_frequency = 2000
print_frequency = 20000
max_outer_iterations = 3000000000
max_inner_iterations = 3000000000
warmup = true
cold_start = true
reuse_matrix_across_penalties = true
reference_tolerance = 1.0e-9
reference_time_limit_seconds = 18000.0

[statistics]
runtime_shift_seconds = 1.0
bootstrap_samples = 20000
bootstrap_seed = 20260816
tail_fraction = 0.10
active_coordinate_relative_threshold = 1.0e-10

