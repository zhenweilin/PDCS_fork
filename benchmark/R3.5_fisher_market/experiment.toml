schema_version = 1
experiment = "R3.5 Fisher coordinate-wise versus scalar-per-cone rescaling"
objective = "min -sum_i w_i*p_i"
formulation = "direct_utility"
value_type = "Float64"
matrix_storage = "in_memory_sparse_csc"
save_instance_data = false

[solver]
name = "cuPDCS"
tolerance = 1.0e-6
time_limit_seconds = 600.0
use_preconditioner = true
rescaling_method = "ruiz_pock_chambolle"
compared_modes = ["diagonal", "scalar_cone"]
scalar_cone_rescaling = [false, true]

[verification]
maximum_independent_primal_violation = 2.0e-5
require_finite_primal = true

[smoke]
m = 20
n = 32
density = 0.5
seeds = [2026]

[formal]
m = 100
n = 5000
density = 1.0
allocation_variables = 500000
seeds = [2026, 2027, 2028, 2029, 2030]
expected_records = 10
pair_on_same_gpu = true
counterbalanced_order = true
